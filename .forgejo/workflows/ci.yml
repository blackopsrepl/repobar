name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: syntax, tests, cli
    runs-on: ruby
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      # make check needs ripgrep for its file list. It now fails fast when rg is
      # missing rather than silently skipping the syntax check.
      - name: Install gate tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ripgrep
          rm -rf /var/lib/apt/lists/*

      - name: Run project checks
        run: make check

# The QuickShell panel is deliberately NOT linted here. qmllint cannot resolve
# the Quickshell `ShellRoot` type (it ships only with a live Quickshell install)
# or QtQuick in this container, so it emits thousands of unresolvable-import and
# unknown-property warnings and exits non-zero no matter how clean the panel is.
# A step that can only fail is noise, not a gate: the panel is linted and
# rendered off-desktop on the workstation and on GitHub CI, where Qt Quick's
# qmltypes are present and qmllint exits 0 on this exact file.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag only becomes a release after the same gates a push to main must pass.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: verify tag, publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag must match the released version surface, or the changelog would
      # describe a version the tree does not claim to be.
      - name: Check the tag matches the version surface
        run: |
          version="$(sed -n 's/^.*Current release: `v\([^`]*\)`.*$/\1/p' README.md)"
          test -n "$version" || { echo "cannot read the current release line from README.md"; exit 1; }
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version surface v$version"
            exit 1
          }

      # Notes come from the generated changelog section for this tag, not
      # --generate-notes: this repository curates its changelog through
      # commit-and-tag-version, and the release body should say the same thing.
      # Older sections predate the link format: their heading is a bare
      # "## 0.1.1 (2026-05-16)" rather than "## [0.1.1](compare-url)", so both
      # shapes are matched. Matching on the version alone would be wrong: the
      # 1.0.0 heading contains "0.1.1" inside its compare URL.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            /^## / {
              if (seen) exit
              if (index($0, "[" tag "]") || index($0, " " tag " (")) seen = 1
              next
            }
            seen { print }
          ' CHANGELOG.md)"
          if [ -z "${body//[[:space:]]/}" ]; then
            body="Release ${GITHUB_REF_NAME}."
          fi
          printf '%s\n' "$body" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

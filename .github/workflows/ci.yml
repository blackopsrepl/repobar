name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax, tests, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq qt6-declarative-dev-tools
          if ! command -v qmllint >/dev/null 2>&1; then
            qml_lint_path="$(find /usr -type f -name qmllint -print -quit)"
            test -n "$qml_lint_path"
            sudo ln -s "$qml_lint_path" /usr/local/bin/qmllint
          fi

      - name: Run project checks
        run: make check

      - name: Lint the QuickShell panel
        run: qmllint frontend/quickshell/shell.qml
